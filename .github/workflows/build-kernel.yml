name: Build fleur kernel (KernelSU)

on:
  workflow_dispatch:
    inputs:
      ksu_repo:
        description: "KernelSU repo URL to use instead of the submodule (leave empty = use submodule)"
        required: false
        default: ""
      ksu_ref:
        description: "Branch/tag/commit of that KernelSU repo (only if ksu_repo is set)"
        required: false
        default: ""
      defconfig:
        description: "Defconfig"
        required: false
        default: "fleur_defconfig"
  push:
    branches: [fleur-r-oss]
    paths-ignore:
      - "**.md"

env:
  DEFCONFIG: ${{ github.event.inputs.defconfig || 'fleur_defconfig' }}
  TC_REPO: https://github.com/kdrag0n/proton-clang
  AK3_REPO: https://github.com/in1tialford/AnyKernel3
  KBUILD_BUILD_USER: nobody
  KBUILD_BUILD_HOST: github-actions
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout kernel (shallow, no submodules yet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Init KernelSU
        run: |
          set -e
          if [ -n "${{ github.event.inputs.ksu_repo }}" ]; then
            echo ">> Using custom KernelSU: ${{ github.event.inputs.ksu_repo }}"
            git rm -rf --cached KernelSU 2>/dev/null || true
            rm -rf KernelSU
            git clone "${{ github.event.inputs.ksu_repo }}" KernelSU
            if [ -n "${{ github.event.inputs.ksu_ref }}" ]; then
              git -C KernelSU checkout "${{ github.event.inputs.ksu_ref }}"
            fi
          else
            echo ">> Using KernelSU submodule"
            git submodule update --init --recursive KernelSU
            # KernelSU's Makefile calls `git describe` / `rev-list` for its version,
            # so it needs real history + tags, not a shallow checkout
            git -C KernelSU fetch --unshallow --tags 2>/dev/null || git -C KernelSU fetch --tags || true
          fi
          ls -la KernelSU | head
          ls -la drivers/kernelsu || echo "!! drivers/kernelsu missing (symlink to ../KernelSU/kernel)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            ccache cpio lz4 zip unzip zstd xz-utils python3 \
            device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git curl ca-certificates dwarves

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ env.DEFCONFIG }}-${{ github.sha }}
          restore-keys: ccache-${{ env.DEFCONFIG }}-

      - name: Get Clang toolchain
        run: |
          git clone --depth=1 "$TC_REPO" "$HOME/tc"
          "$HOME/tc/bin/clang" --version | head -1

      - name: Configure kernel
        run: |
          export PATH="$HOME/tc/bin:$PATH"
          mkdir -p out
          make O=out ARCH=arm64 CC=clang LD=ld.lld "$DEFCONFIG"

          # KernelSU on a non-GKI 4.14 kernel needs these
          scripts/config --file out/.config \
            -e KSU \
            -e MODULES \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e OVERLAY_FS || true
          make O=out ARCH=arm64 CC=clang LD=ld.lld olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS" out/.config || true

      - name: Build kernel
        run: |
          export PATH="$HOME/tc/bin:$PATH"
          export CCACHE_COMPRESS=1
          ccache -M 5G || true
          START=$SECONDS
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" LD=ld.lld AR=llvm-ar AS=llvm-as NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-O2 -fomit-frame-pointer" HOSTLDFLAGS="-O2" \
            KBUILD_BUILD_USER="$KBUILD_BUILD_USER" KBUILD_BUILD_HOST="$KBUILD_BUILD_HOST" \
            2>&1 | tee build.log
          echo "Build time: $(( (SECONDS-START)/60 )) min"
          ls -la out/arch/arm64/boot/ || true

      - name: Package with AnyKernel3
        run: |
          set -e
          BOOT=out/arch/arm64/boot
          if   [ -f "$BOOT/Image.gz-dtb" ]; then IMG="$BOOT/Image.gz-dtb"
          elif [ -f "$BOOT/Image.gz" ];     then IMG="$BOOT/Image.gz"
          elif [ -f "$BOOT/Image" ];        then IMG="$BOOT/Image"
          else echo "No kernel image produced"; exit 1; fi
          echo "Using $IMG"

          git clone --depth=1 "$AK3_REPO" AnyKernel3
          cp "$IMG" AnyKernel3/
          [ -f "$BOOT/dtb" ] && cp "$BOOT/dtb" AnyKernel3/ || true
          [ -f "$BOOT/dtbo.img" ] && cp "$BOOT/dtbo.img" AnyKernel3/ || true

          ZIPNAME="fleur-KSU-$(date +%Y%m%d-%H%M).zip"
          (cd AnyKernel3 && zip -r9 "../$ZIPNAME" . -x '*.git*' README.md '*placeholder')
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ env.ZIPNAME }}
          if-no-files-found: error

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
